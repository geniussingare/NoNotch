name: noNotch
options:
  bundleIdPrefix: com.ganeshsingare
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Stable local identity (scripts/setup-signing.sh) so macOS keeps permissions across builds.
    CODE_SIGN_IDENTITY: "GeniusSoft Development"
    CODE_SIGN_STYLE: Manual
    OTHER_CODE_SIGN_FLAGS: --timestamp=none
    ENABLE_HARDENED_RUNTIME: NO
targets:
  noNotch:
    type: application
    platform: macOS
    sources:
      - path: noNotch
      - path: Vendor/MediaRemoteAdapter/bin/mediaremote-adapter.pl
        buildPhase: resources
    dependencies:
      - target: MediaRemoteAdapter
        embed: true
      - target: noNotchMCP
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    info:
      path: noNotch/Info.plist
      properties:
        CFBundleDisplayName: noNotch
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© 2026 GeniusSoft™. All rights reserved. noNotch™ is a trademark of GeniusSoft."
        NSCalendarsFullAccessUsageDescription: noNotch shows your next event and meeting links in the notch.
        NSCalendarsUsageDescription: noNotch shows your next event and meeting links in the notch.
        NSAppleEventsUsageDescription: noNotch controls Music, Spotify and system appearance from the notch.
        NSBluetoothAlwaysUsageDescription: noNotch shows when AirPods and other Bluetooth devices connect.
        NSLocationUsageDescription: noNotch shows the weather where you are.
        NSLocationWhenInUseUsageDescription: noNotch shows the weather where you are.
        NSCameraUsageDescription: noNotch shows a quick mirror so you can check yourself before a call.
        NSRemindersFullAccessUsageDescription: noNotch can keep your tasks in sync with a noNotch list in Reminders, so they reach your iPhone and Apple Watch.
        NSRemindersUsageDescription: noNotch can keep your tasks in sync with a noNotch list in Reminders, so they reach your iPhone and Apple Watch.
        NSMicrophoneUsageDescription: noNotch listens only while you dictate a task or note.
        NSSpeechRecognitionUsageDescription: noNotch turns your dictation into text, on this Mac when possible.
    entitlements:
      path: noNotch/noNotch.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.automation.apple-events: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.personal-information.location: true
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
    scheme:
      testTargets:
        - noNotchTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ganeshsingare.noNotch
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  noNotchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: noNotchTests
    dependencies:
      - target: noNotch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ganeshsingare.noNotchTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/noNotch.app/Contents/MacOS/noNotch
        BUNDLE_LOADER: $(TEST_HOST)

  # Vendored from github.com/ungive/mediaremote-adapter (BSD-3-Clause).
  # Loaded by /usr/bin/perl so now-playing works on macOS 15.4+.
  MediaRemoteAdapter:
    type: framework
    platform: macOS
    sources:
      - path: Vendor/MediaRemoteAdapter/src/adapter
      - path: Vendor/MediaRemoteAdapter/src/private
      - path: Vendor/MediaRemoteAdapter/src/utility
      - path: Vendor/MediaRemoteAdapter/include
        headerVisibility: public
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vandenbe.MediaRemoteAdapter
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS: $(SRCROOT)/Vendor/MediaRemoteAdapter/include $(SRCROOT)/Vendor/MediaRemoteAdapter/src
        CLANG_ENABLE_OBJC_ARC: YES
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES
        OTHER_LDFLAGS: -framework Foundation -framework AppKit -framework UniformTypeIdentifiers
        DEFINES_MODULE: NO
        SKIP_INSTALL: YES
  noNotchMCP:
    type: tool
    platform: macOS
    sources:
      - path: noNotchMCP
      - path: noNotch/Shared
    settings:
      base:
        PRODUCT_NAME: nonotch-mcp
        PRODUCT_BUNDLE_IDENTIFIER: com.ganeshsingare.noNotch.mcp
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SKIP_INSTALL: YES
